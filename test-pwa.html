<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TestPWA">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="test-manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Test PWA</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100%; background: #0a0a0a; color: #fff; font-family: sans-serif; }
  .red-line {
    position: fixed;
    top: 0;
    left: 50%;
    width: 4px;
    height: 100vh;
    background: red;
    z-index: 9999;
  }
  .content {
    padding: 0 20px;
  }
  .block {
    height: 200px;
    margin: 10px 0;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: bold;
  }
</style>
</head>
<body>
<div class="red-line"></div>
<div class="content">
  <div class="block" style="background:#f7cc49;color:#000;margin-top:0">CIMA PAGINA</div>
  <div class="block" style="background:#333">Blocco 2</div>
  <div class="block" style="background:#555">Blocco 3</div>
  <div class="block" style="background:#777">Blocco 4</div>
  <div class="block" style="background:#999">Blocco 5</div>
  <div class="block" style="background:#333">Blocco 6</div>
  <div class="block" style="background:#555">Blocco 7</div>
  <div class="block" style="background:#f7cc49;color:#000">FONDO PAGINA</div>
</div>
</body>
</html>
