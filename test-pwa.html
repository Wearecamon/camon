<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TestPWA">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="test-manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Test PWA</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #0a0a0a; color: #fff; font-family: sans-serif; }
  .content {
    padding: env(safe-area-inset-top, 0px) 20px env(safe-area-inset-bottom, 0px);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  h1 { font-size: 32px; color: #f7cc49; margin-bottom: 10px; }
  p { font-size: 18px; opacity: 0.7; }
</style>
</head>
<body>
<div class="content">
  <h1>TEST PWA</h1>
  <p>Se non vedi barre nere, funziona!</p>
  <p style="margin-top:20px;font-size:14px;opacity:0.4">black-translucent + standalone</p>
</div>
</body>
</html>
